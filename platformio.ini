[platformio]
default_envs = native

; ─── Native (host) environment — runs on CI and local without hardware ────────
[env:native]
platform = native
test_framework = unity
; Implementation sources are #included directly inside each test file.
; This sidesteps PlatformIO's native-test limitation where src/ is not
; auto-compiled when library.json targets arduino/espressif32 only.
build_flags =
  -DATCHOPS_TARGET_NATIVE
  -I src
  ${sysenv.MBEDTLS_CFLAGS}
  ${sysenv.MBEDTLS_LDFLAGS}
  -lmbedtls
  -lmbedcrypto
  -lmbedx509
lib_compat_mode = off

; ─── ESP32 Arduino environment (for reference / on-device build) ─────────────
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ─── ESP32-P4 Arduino environment ─────────────────────────────────────────────
; Uses the pioarduino fork of espressif32 — the official PlatformIO registry
; platform does not yet include ESP32-P4 board definitions.
[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4_r3-evboard
framework = arduino
monitor_speed = 115200
