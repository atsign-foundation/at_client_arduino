name: Build ESP32-P4

on:
  push:
    branches: ["main", "trunk"]
  pull_request:
    branches: ["main", "trunk"]

jobs:
  build-esp32-p4:
    name: Compile for ESP32-P4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-esp32p4-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32p4-

      # The esp32-p4_r3-evboard board definition only exists in the pioarduino
      # fork of the espressif32 platform. `pio ci --board` resolves board IDs
      # before applying project options, so the platform must be installed
      # globally first or board lookup fails.
      - name: Install pioarduino espressif32 platform
        run: >-
          pio pkg install -g
          --platform https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

      - name: Compile BasicPKAMAuth example for ESP32-P4
        run: >-
          pio ci
          --board=esp32-p4_r3-evboard
          --project-option="platform=https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip"
          --lib=.
          examples/BasicPKAMAuth/BasicPKAMAuth.ino
